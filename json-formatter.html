<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="google-site-verification" content="googlef7b08a4a2322d6af.html">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; worker-src 'none'; media-src 'none'"
    >
    <title>Secure JSON Formatter - Readable Dev Tools</title>
    <meta name="description" content="Secure browser-only JSON formatter. Format JSON locally without uploading your data.">
    <link rel="canonical" href="https://readable-dev-tools.pages.dev/json-formatter.html">
    <link rel="stylesheet" href="styles/style.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="site-header">
        <div>
          <p class="eyebrow">Readable Dev Tools</p>
          <h1>Secure JSON Formatter</h1>
          <p class="lead">Format JSON securely in your browser. No uploads. No API calls. No storage.</p>
        </div>
      </header>

      <main>
        <section class="security-panel" aria-labelledby="json-title">
          <div class="security-heading">
            <h2 id="json-title">Browser-only JSON formatting</h2>
            <p>Paste JSON, format it with 2-space indentation, and keep sensitive payloads local.</p>
          </div>
          <div class="badge-grid">
            <span class="security-badge">Secure JSON Formatter</span>
            <span class="security-badge">Local Processing</span>
            <span class="security-badge">No Uploads</span>
          </div>
        </section>
      </main>

      <footer class="site-footer">
        <p><a href="/">Open Tool</a></p>
      </footer>
    </div>
  </body>
</html>
